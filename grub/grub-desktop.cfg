set timeout=5
set timeout_style=menu
set default=0

# Opt-in desktop boot (see sidelined/README.md): the kernel starts the
# ring-3 Mako compositor and the interactive DemonX server, then the
# DemonWM window manager and the xterm-style terminal client, and hands
# off to the desktop session loop. This is a SEPARATE entry point from
# grub.cfg's plain interactive console (which `make run` boots by
# default) -- the "desktop" cmdline needle is what tells the kernel to
# actually take over the boot with the desktop stack; without it, having
# compositor.elf etc. present in RAMFS does nothing on its own. The
# compositor mandates a 640x480 ARGB framebuffer (it exits with an error
# code on any other resolution), so the kernel is handed exactly that mode.
insmod all_video
insmod gfxterm
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=640x480
    terminal_output gfxterm
fi

menuentry "MAKO Kernel Project (Desktop)" {
    multiboot2 /boot/kernel.elf desktop
    module2 /boot/mako/sdk.mko /system/mko/sdk.mko
    module2 /boot/mako/hello.mko /projects/hello/main.mko
    module2 /boot/mako/hello.elf /projects/hello/main.elf
    module2 /boot/mako/compositor.elf /system/bin/compositor.elf
    module2 /boot/mako/demonx.elf /system/bin/demonx.elf
    module2 /boot/mako/demonwm.elf /system/bin/demonwm.elf
    module2 /boot/mako/xterm.elf /system/bin/xterm.elf
    module2 /boot/mako/tetris.elf /system/bin/tetris.elf
    module2 /boot/mako/cxx-hello.elf /system/bin/cxx-hello.elf
    module2 /boot/mako/portcheck.elf /system/bin/portcheck.elf
    module2 /boot/mako/doom.elf /system/bin/doom.elf
    module2 /boot/mako/doom-full.elf /system/bin/doom-full.elf
    module2 /boot/mako/classicube-core.elf /system/bin/classicube-core.elf
    module2 /boot/mako/quake-core.elf /system/bin/quake-core.elf
    module2 /boot/mako/mako-manifest.txt /system/mako/manifest.txt
    module2 /boot/mako/README.md /README.md
    module2 /system/mako/MAKO-source.tar.zst /system/mako/MAKO-source.tar.zst
    module2 /games/freedoom/freedoom1.wad /games/freedoom/freedoom1.wad
    module2 /games/quake/pak0.pak /home/demon/id1/pak0.pak
    boot
}
