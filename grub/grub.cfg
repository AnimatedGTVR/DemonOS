set timeout=5
set timeout_style=menu
set default=0

# Branded boot menu: reuses the same Flowers.jpg image the desktop uses as
# its wallpaper (see the Makefile's wallpaper_argb.o rule) so the boot screen
# and the desktop look like one product instead of a bare GRUB prompt handing
# off to a themed OS. Only grub.cfg (make run's interactive ISO) does this --
# grub-test.cfg stays timeout=0/no-menu on purpose, since every smoke/check
# target depends on it responding immediately with no screens to wait through.
insmod all_video
insmod gfxterm
insmod jpeg
insmod png
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768
    terminal_output gfxterm
fi
background_image -m stretch /boot/grub/boot-background.png
set color_normal=white/black
set color_highlight=black/light-blue

menuentry "MAKO Kernel Project -- DemonOS" {
    multiboot2 /boot/kernel.elf
    module2 /boot/mako/sdk.mko /system/mko/sdk.mko
    module2 /boot/mako/hello.mko /projects/hello/main.mko
    module2 /boot/mako/hello.elf /projects/hello/main.elf
    module2 /boot/mako/compositor.elf /system/bin/compositor.elf
    module2 /boot/mako/window-client.elf /system/bin/window-client.elf
    module2 /boot/mako/window-move-client.elf /system/bin/window-move-client.elf
    module2 /boot/mako/window-event-client.elf /system/bin/window-event-client.elf
    module2 /boot/mako/window-crash-client.elf /system/bin/window-crash-client.elf
    module2 /boot/mako/demonx.elf /system/bin/demonx.elf
    module2 /boot/mako/demonx-client.elf /system/bin/demonx-client.elf
    module2 /boot/mako/tetris.elf /system/bin/tetris.elf
    module2 /boot/mako/calculator.elf /system/bin/calculator.elf
    module2 /boot/mako/cxx-hello.elf /system/bin/cxx-hello.elf
    module2 /boot/mako/ede-calc.elf /system/bin/ede-calc.elf
    module2 /boot/mako/ede-about.elf /system/bin/ede-about.elf
    module2 /boot/mako/ede-tip.elf /system/bin/ede-tip.elf
    module2 /boot/mako/ede-preferred.elf /system/bin/ede-preferred.elf
    module2 /boot/mako/ede-conf.elf /system/bin/ede-conf.elf
    module2 /boot/mako/ede-autostart.elf /system/bin/ede-autostart.elf
    module2 /boot/mako/ede-timedate.elf /system/bin/ede-timedate.elf
    module2 /boot/mako/terminal-client.elf /system/bin/terminal-client.elf
    module2 /boot/mako/counter-client.elf /system/bin/counter-client.elf
    module2 /boot/mako/browser-client.elf /system/bin/browser-client.elf
    module2 /boot/mako/mako-manifest.txt /system/mako/manifest.txt
    module2 /boot/mako/README.md /README.md
    boot
}

# "cli" cmdline token -- see multiboot_cli_mode()/kernel.c main(): the kernel
# skips spawning the compositor and native desktop entirely and drops
# straight into makobox_shell() (the same kernel-resident command shell the
# graphical boot only falls back to when no framebuffer is present). Same
# modules as the graphical entry are still loaded (RAMFS install still
# happens either way) so `apps`/`projects`/etc. inside MakoBox have the
# usual starter content to point at.
menuentry "MAKO Kernel Project -- Command Line" {
    multiboot2 /boot/kernel.elf cli
    module2 /boot/mako/sdk.mko /system/mko/sdk.mko
    module2 /boot/mako/hello.mko /projects/hello/main.mko
    module2 /boot/mako/hello.elf /projects/hello/main.elf
    module2 /boot/mako/compositor.elf /system/bin/compositor.elf
    module2 /boot/mako/window-client.elf /system/bin/window-client.elf
    module2 /boot/mako/window-move-client.elf /system/bin/window-move-client.elf
    module2 /boot/mako/window-event-client.elf /system/bin/window-event-client.elf
    module2 /boot/mako/window-crash-client.elf /system/bin/window-crash-client.elf
    module2 /boot/mako/demonx.elf /system/bin/demonx.elf
    module2 /boot/mako/demonx-client.elf /system/bin/demonx-client.elf
    module2 /boot/mako/tetris.elf /system/bin/tetris.elf
    module2 /boot/mako/calculator.elf /system/bin/calculator.elf
    module2 /boot/mako/cxx-hello.elf /system/bin/cxx-hello.elf
    module2 /boot/mako/ede-calc.elf /system/bin/ede-calc.elf
    module2 /boot/mako/ede-about.elf /system/bin/ede-about.elf
    module2 /boot/mako/ede-tip.elf /system/bin/ede-tip.elf
    module2 /boot/mako/ede-preferred.elf /system/bin/ede-preferred.elf
    module2 /boot/mako/ede-conf.elf /system/bin/ede-conf.elf
    module2 /boot/mako/ede-autostart.elf /system/bin/ede-autostart.elf
    module2 /boot/mako/ede-timedate.elf /system/bin/ede-timedate.elf
    module2 /boot/mako/terminal-client.elf /system/bin/terminal-client.elf
    module2 /boot/mako/counter-client.elf /system/bin/counter-client.elf
    module2 /boot/mako/browser-client.elf /system/bin/browser-client.elf
    module2 /boot/mako/mako-manifest.txt /system/mako/manifest.txt
    module2 /boot/mako/README.md /README.md
    boot
}

# EDDE (Equinox Desktop DemonOS Environment): boots the SAME kernel and app
# catalog as the DemonOS entry above, but maps compositor-edde.elf (see
# user/compositor_edde.mko / Desktop/desktop_edde.mko) into
# /system/bin/compositor.elf instead of the original compositor.elf -- the
# only line that differs from the DemonOS entry. The kernel always spawns
# whatever ELF sits at that fixed RAMFS path, so no kernel change was
# needed to make this its own independently-evolvable desktop shell.
menuentry "MAKO Kernel Project -- EDDE (Equinox Desktop DemonOS Environment)" {
    multiboot2 /boot/kernel.elf
    module2 /boot/mako/sdk.mko /system/mko/sdk.mko
    module2 /boot/mako/hello.mko /projects/hello/main.mko
